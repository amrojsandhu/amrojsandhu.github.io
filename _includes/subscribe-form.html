<div class="subscribe-form" id="subscribeForm">
  <form class="subscribe-form__form" id="subscribeFormEl" novalidate>
    <div class="subscribe-form__fields">
      <input id="subscribeEmail" name="email" type="email" placeholder="Enter your email" required autocomplete="email" />
      <button type="submit" class="button cta-button">Subscribe <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline; margin-left: 6px; vertical-align: -1.5px;">
  <polyline points="6 4 12 10 6 16"></polyline>
</svg></button>
    </div>
    <div class="cta-side-info">
      <div class="founding-note">Free beta for 30 days</div>
      <div class="cta-note">You’ll be redirected to the app after signup.</div>
      <div class="subscribe-status" aria-live="polite"></div>
    </div>
  </form>
</div>
